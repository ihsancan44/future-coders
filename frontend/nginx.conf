server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Admin panelinden 1 GB'a kadar video yüklenebilir.
  client_max_body_size 1100m;
  server_tokens off;

  # Backend kapsayıcısı yeniden oluşturulunca IP'si değişebilir: adres her istekte Docker DNS'inden çözülür.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:4000;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location /uploads/ {
    proxy_pass $backend;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # React Router: bilinmeyen adresleri uygulamaya bırak. index.html önbelleğe alınmaz,
  # yoksa yeni sürümden sonra eski dosyaları arayan tarayıcı boş sayfa gösterir.
  # Güvenlik başlıkları burada (API ve /uploads başlıklarını backend'deki helmet ekliyor).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
