<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#053471" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      // Sayfa açılırken beyaz parlama olmasın: kayıtlı tema React yüklenmeden uygulanır.
      try {
        var t = localStorage.getItem("codevia-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Codevia: Lise öğrencileri için yazılım kursları</h1>
      <p>Codevia ile üniversiteye geçmeden yazılım öğren. Seviye sınavı, seviyene göre video kurslar, tarayıcıda çalışan derleyici ve kurs sonu testleriyle adım adım ilerle. Siteyi kullanmak için tarayıcında JavaScript'i aç.</p>
      <ul>
        <li><a href="/courses">Kurslar</a></li>
        <li><a href="/roadmap">Yol Haritası</a></li>
        <li><a href="/compiler">Online Derleyici</a></li>
        <li><a href="/register">Kayıt ol</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
