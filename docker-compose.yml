# Tüm uygulamayı tek komutla çalıştırır: docker compose up --build
# Önce bu klasörde .env dosyası oluşturun (bkz. .env.example): JWT_SECRET ve ADMIN_PASSWORD zorunludur.
# Site: http://localhost:8080 (canlıda önüne HTTPS sağlayan bir ters vekil koyun, bkz. README "Canlıya alma").
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: futurecoders
      POSTGRES_PASSWORD: futurecoders
      POSTGRES_DB: futurecoders
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurecoders"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://futurecoders:futurecoders@db:5432/futurecoders
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET verilmeli (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      SITE_URL: ${SITE_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@futurecoders.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD verilmeli}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Codevia <no-reply@futurecoders.dev>}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5-5}
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-https://wandbox.org}
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:
  uploads:
